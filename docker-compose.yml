name: finz-financial-review

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finz
      POSTGRES_PASSWORD: finz
      POSTGRES_DB: finz
    ports:
      - "5432:5432"
    volumes:
      - finz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finz -d finz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://finz:finz@db:5432/finz
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      ENABLE_LLM_CLASSIFICATION: ${ENABLE_LLM_CLASSIFICATION:-true}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      SEED_DATASET_PATH: /app/sample_data/NYC Restaurant Co. - Raw Transactions.xlsx
      SAMPLE_DATASET_PATH: /app/sample_data/NYC Restaurant Co. - Raw Transactions.xlsx
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  finz_pgdata: