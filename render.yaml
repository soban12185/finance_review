# Render Blueprint - FINZ backend (free tier).
# Deploy by importing this repo in Render: New + → Blueprint (pick the repo).
# You fill in DATABASE_URL (e.g. a free Neon Postgres connection string) and
# GROQ_API_KEY (optional - the app runs rules-only without it).
services:
  - type: web
    name: finz-backend
    runtime: python
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Paste your Postgres connection string here (e.g. from Neon). Kept as a
      # Render secret - never committed to the repo.
      - key: DATABASE_URL
        sync: false                 # prompt at deploy time (your Neon URL)
      - key: GROQ_API_KEY
        sync: false                 # optional; rules-only classification works without it
      - key: ENABLE_LLM_CLASSIFICATION
        value: "true"
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      # "*" allows the Vercel frontend origin to call the API. Prefer setting
      # FRONTEND_URL to your exact production frontend URL (e.g. the Vercel
      # domain) - the app adds it to the allowed origins alongside this list.
      - key: CORS_ORIGINS
        value: "*"
      - key: FRONTEND_URL
        sync: false                 # exact frontend origin, e.g. https://app.vercel.app
      # Sample dataset lives inside backend/sample_data, so "Load sample dataset"
      # and first-boot auto-seeding work without any volume mounts.
      - key: SEED_DATASET_PATH
        value: sample_data/NYC Restaurant Co. - Raw Transactions.xlsx
      - key: SAMPLE_DATASET_PATH
        value: sample_data/NYC Restaurant Co. - Raw Transactions.xlsx